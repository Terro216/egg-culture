services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - news_cache:/app/.news-cache
      - kladka_data:/app/.kladka
    labels:
      caddy: egg.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 4321}}"
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true

volumes:
  news_cache:
  kladka_data:
