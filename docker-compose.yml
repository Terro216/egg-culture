services:
  web:
    build:
      context: .
      args:
        DOMAIN: ${DOMAIN:-ilyamedve.dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://cinemarr-tgbot-proxy:3128
      NO_PROXY: localhost,127.0.0.1,::1
    volumes:
      - news_cache:/app/.news-cache
      - kladka_data:/app/.kladka
    labels:
      caddy: egg.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 4321}}"
    networks:
      - caddy_net
      - media_net
    # Прямой маршрут и прежний Telegram-пин перестали отвечать 22.10.2026.
    # Используем существующий SSH-туннель до DE; соседние сервисы не меняются.
    # Локальные вызовы поллера обходят прокси через NO_PROXY.
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    profiles: ["backup"]
    build:
      context: ./backup
    image: egg-culture-backup:restic-0.19.1-rclone-1.74.4
    env_file:
      - path: .env.backup
        required: false
        format: raw
    volumes:
      - kladka_data:/sources/kladka:ro
      - type: bind
        source: /srv/egg-culture-backup
        target: /backup
        bind:
          create_host_path: false
      - type: bind
        source: /home/me/.egg-culture/rclone
        target: /config/rclone
        bind:
          create_host_path: false
    network_mode: bridge
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384M
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy_net:
    external: true
  media_net:
    external: true

volumes:
  news_cache:
  kladka_data:
