services:
  web:
    build:
      context: .
      args:
        DOMAIN: ${DOMAIN:-ilyamedve.dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://telegram-egress:3128
      NO_PROXY: localhost,127.0.0.1,::1
    volumes:
      - news_cache:/app/.news-cache
      - kladka_data:/app/.kladka
    labels:
      caddy: egg.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 4321}}"
    networks:
      - caddy_net
      - telegram
    # Прямой маршрут и прежний Telegram-пин перестали отвечать 22.10.2026.
    # Локальные вызовы поллера обходят прокси через NO_PROXY.
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  telegram-egress:
    image: ${EGG_TUNNEL_IMAGE:-egg-culture-tunnel:local}
    build: ./deploy/tunnel
    container_name: egg-culture-tunnel
    restart: unless-stopped
    # Read-only rootfs/mounts and no Linux capabilities; no host ports/socket.
    user: "0:0"
    volumes:
      - type: bind
        source: ${EGG_TUNNEL_KEYS_DIR:-/etc/egg-culture/tunnel}
        target: /keys
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/egg-culture/endpoint.json
        target: /config/endpoint.json
        read_only: true
        bind: {create_host_path: false}
    networks:
      telegram:
      telegram_egress:
        gw_priority: 1
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 32
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "3"}

  backup:
    profiles: ["backup"]
    build:
      context: ./backup
    image: egg-culture-backup:restic-0.19.1-rclone-1.74.4
    env_file:
      - path: .env.backup
        required: false
        format: raw
    volumes:
      - kladka_data:/sources/kladka:ro
      - type: bind
        source: /srv/egg-culture-backup
        target: /backup
        bind:
          create_host_path: false
      - type: bind
        source: /etc/egg-culture/rclone
        target: /config/rclone
        bind:
          create_host_path: false
    network_mode: bridge
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384M
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy_net:
    external: true
  telegram:
    internal: true
    ipam:
      config:
        - subnet: ${EGG_TELEGRAM_INTERNAL_SUBNET:-172.28.0.0/28}
  telegram_egress:
    ipam:
      config:
        - subnet: ${EGG_TELEGRAM_EGRESS_SUBNET:-172.28.0.16/28}

volumes:
  news_cache:
  kladka_data:
